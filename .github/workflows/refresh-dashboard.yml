name: Refresh performance dashboard

# Schedule disabled: this requires a Shopify custom app (SHOPIFY_CLIENT_ID /
# SHOPIFY_CLIENT_SECRET) that installation kept failing ("This installation
# link can't be used"). Daily refresh now runs via a Claude Routine instead
# (reuses the Shopify/Meta Ads connectors already authorized in-session, no
# app install needed). Re-enable the schedule below if you get a working
# Shopify app set up later — this workflow still works manually via
# workflow_dispatch once the two secrets exist.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: claude/ecommerce-metrics-dashboard-37cylk
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest metrics
        env:
          SHOPIFY_STORE_DOMAIN: elan-clothing-r.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          META_AD_ACCOUNT_ID: "1778418969517591"
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          cd dashboard
          python3 fetch_metrics.py
          python3 build.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- dashboard/data.json dashboard/index.html; then
            echo "No data changes, skipping commit."
            exit 0
          fi
          git add dashboard/data.json dashboard/index.html
          git commit -m "Refresh dashboard data ($(date -u +%Y-%m-%d))"
          git push origin HEAD:claude/ecommerce-metrics-dashboard-37cylk
